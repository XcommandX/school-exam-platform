<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">Original static parabola fallback</title><desc id="desc">The graph of y equals x squared minus 4 crosses the x axis at negative 2 and 2. The vertex is at 0, negative 4.</desc>
<rect width="600" height="400" fill="#fff"/><g stroke="#d8dce5" stroke-width="1"><path d="M100 40V360 M140 40V360 M180 40V360 M220 40V360 M260 40V360 M300 40V360 M340 40V360 M380 40V360 M420 40V360 M460 40V360 M500 40V360"/><path d="M80 40H520 M80 80H520 M80 120H520 M80 160H520 M80 200H520 M80 240H520 M80 280H520 M80 320H520 M80 360H520"/></g><g stroke="#202533" stroke-width="2"><path d="M80 200H535 M300 375V25"/></g><path d="M180 0 Q300 720 420 0" fill="none" stroke="#3155b7" stroke-width="3"/><g font-family="sans-serif" font-size="18" fill="#202533"><text x="540" y="191">x</text><text x="311" y="25">y</text><text x="208" y="224">−2</text><text x="374" y="224">2</text><text x="306" y="363">−4</text><text x="355" y="54">y = x² − 4</text></g><circle cx="220" cy="200" r="4" fill="#3155b7"/><circle cx="380" cy="200" r="4" fill="#3155b7"/></svg>