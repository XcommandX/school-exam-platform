<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
<title id="title">Original right triangle diagram</title><desc id="desc">A right triangle has perpendicular legs labeled 6 units and 4 units. The diagram is not drawn to scale.</desc>
<rect width="600" height="320" fill="#fff"/><g stroke="#202533" stroke-width="3" fill="none"><path d="M140 245 L440 245 L140 65 Z"/><path d="M140 220 H165 V245"/></g><g fill="#202533" font-family="sans-serif" font-size="23"><text x="275" y="284">6 units</text><text x="36" y="162">4 units</text></g><text x="305" y="32" text-anchor="middle" fill="#596070" font-family="sans-serif" font-size="16">Diagram not drawn to scale</text></svg>