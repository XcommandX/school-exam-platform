<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="description" content="TOEFL、SAT 与 AP 的统一学习空间。">
  <title>Study Space · 学习空间</title>
  <link rel="stylesheet" href="/web/styles.css">
  <script src="/web/home-model.js" defer></script>
  <script src="/web/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳转到内容</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Study Space 首页">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M6 7.5h7.5L16 10l2.5-2.5H26v17h-7.5L16 27l-2.5-2.5H6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 10v17M9.5 12h3M9.5 16h3M20 16l1.8 1.8L25 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-type">Study Space</span>
    </a>
    <div class="account-wrap">
      <button type="button" class="account-trigger" id="account-button" aria-label="admin 的个人账号与设置" aria-expanded="false" aria-controls="account-menu"><span class="avatar">A</span><span>admin</span><span data-icon="chevronDown"></span></button>
      <div class="account-menu" id="account-menu" hidden>
        <div class="menu-user"><span class="avatar large">A</span><span><strong>admin</strong></span></div>
        <div class="menu-stats"><div><b id="menu-streak">0</b><small>连续天数</small></div><div><b id="menu-answers">0</b><small>已练题目</small></div><div><b id="menu-accuracy">—</b><small>客观题正确率</small></div></div>
        <div class="menu-links">
          <button type="button" data-dialog="account"><span data-icon="user"></span><span>个人中心</span><span data-icon="chevron"></span></button>
          <button type="button" data-dialog="targets"><span data-icon="target"></span><span>目标分数</span><span data-icon="chevron"></span></button>
          <button type="button" data-dialog="plan"><span data-icon="calendar"></span><span>学习计划</span><span data-icon="chevron"></span></button>
          <button type="button" data-dialog="report"><span data-icon="chart"></span><span>成绩报告</span><span data-icon="chevron"></span></button>
          <button type="button" data-dialog="records"><span data-icon="history"></span><span>练习记录</span><span data-icon="chevron"></span></button>
          <button type="button" data-dialog="saved"><span data-icon="star"></span><span>我的收藏</span><span data-icon="chevron"></span></button>
          <button type="button" data-dialog="settings"><span data-icon="settings"></span><span>设置</span><span data-icon="chevron"></span></button>
        </div>
      </div>
    </div>
  </header>

  <main id="main-content" class="page-shell">
    <section class="welcome-row" aria-label="学习概览">
      <h1><span id="greeting">你好</span>，admin<span class="sun-badge" data-icon="sun"></span></h1>
      <div class="summary-chips">
        <div class="summary-chip" aria-label="连续坚持天数"><span class="chip-icon orange" data-icon="flame"></span><b id="streak-days">0</b><small>连续天数</small></div>
        <button type="button" class="summary-chip" data-dialog="plan" aria-label="查看今日完成与每日学习目标"><span class="chip-icon mint" data-icon="check"></span><b id="today-progress">0 / 30</b><small>今日完成 / 目标</small></button>
        <div class="target-wrap"><button type="button" class="summary-chip target-chip" data-dialog="targets" aria-describedby="target-tooltip"><span class="chip-icon yellow" data-icon="trophy"></span><span class="score-pair"><b id="toefl-target">—</b><span>·</span><b id="sat-target">—</b></span><small>目标分数</small></button><div class="target-tooltip" id="target-tooltip" role="tooltip"></div></div>
      </div>
    </section>
    <div class="service-note" id="service-note" role="status" hidden></div>
    <section class="exam-entries" aria-label="选择考试">
      <article class="exam-card toefl">
        <div class="card-texture" aria-hidden="true"></div>
        <div class="floating-tile tile-one" data-icon="globe" aria-hidden="true"></div><div class="floating-tile tile-two" data-icon="headphones" aria-hidden="true"></div><div class="floating-tile tile-three" data-icon="mic" aria-hidden="true"></div><div class="card-glyph" data-icon="globe" aria-hidden="true"></div>
        <div class="card-badge"><span data-icon="plane"></span>iBT</div>
        <div class="card-title"><h2>TOEFL</h2><p>托福</p></div>
        <div class="card-bottom"><div class="subject-links" aria-label="TOEFL 分项练习"><a href="/toefl/?section=reading"><span data-icon="book"></span>阅读</a><a href="/toefl/?section=listening"><span data-icon="headphones"></span>听力</a><a href="/toefl/?section=speaking"><span data-icon="mic"></span>口语</a><a href="/toefl/?section=writing"><span data-icon="pencil"></span>写作</a></div><a class="start-button" href="/toefl/">开始练习<span data-icon="arrow"></span></a></div>
      </article>
      <article class="exam-card sat">
        <div class="card-texture" aria-hidden="true"></div>
        <div class="floating-tile tile-one" data-icon="sigma" aria-hidden="true"></div><div class="floating-tile tile-two" data-icon="book" aria-hidden="true"></div><div class="floating-tile tile-three" data-icon="calculator" aria-hidden="true"></div><div class="card-glyph" data-icon="cap" aria-hidden="true"></div>
        <div class="card-badge"><span data-icon="landmark"></span>Digital SAT</div>
        <div class="card-title"><h2>SAT</h2><p>美国高考</p></div>
        <div class="card-bottom"><div class="subject-links" aria-label="SAT 分项练习"><a href="/sat/?view=practiceBuilder&amp;mode=custom"><span data-icon="book"></span>英语</a><button type="button" data-dialog="math"><span data-icon="function"></span>数学</button></div><a class="start-button" href="/sat/?view=dashboard">开始练习<span data-icon="arrow"></span></a></div>
      </article>
    </section>
    <section class="home-ap-entry" aria-labelledby="home-ap-title">
      <div class="home-ap-heading"><span class="home-ap-mark" data-icon="book" aria-hidden="true"></span><h2 id="home-ap-title">AP English Language and Composition</h2></div>
      <nav class="home-ap-actions" aria-label="AP 练习入口">
        <a class="home-ap-kind" href="/ap/?kind=mcq" aria-label="AP 选择题 MCQ">MCQ</a>
        <a class="home-ap-kind" href="/ap/?kind=frq" aria-label="AP 写作题 FRQ">FRQ</a>
        <a class="home-ap-start" href="/ap/" aria-label="开始 AP 练习">开始练习<span data-icon="arrow" aria-hidden="true"></span></a>
      </nav>
    </section>
    <footer class="site-footer"><div><button type="button" data-dialog="vocab">Personal Vocab</button></div></footer>
  </main>
  <dialog class="home-dialog" id="home-dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="button" class="icon-button" data-close-dialog aria-label="关闭"><span data-icon="close"></span></button></div><div id="dialog-content"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
