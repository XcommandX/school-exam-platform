<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="referrer" content="same-origin">
  <title>数学竞赛 · Study Space</title>
  <link rel="stylesheet" href="/web/styles.css">
  <link rel="stylesheet" href="/contests/styles.css">
  <script src="/contests/model.js" defer></script>
  <script src="/contests/mathjax-config.js" defer></script>
  <script src="/contests/app.js" defer></script>
</head>
<body class="contest-app">
  <a class="skip-link" href="#main-content">跳转到内容</a>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Study Space 首页">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M6 7.5h7.5L16 10l2.5-2.5H26v17h-7.5L16 27l-2.5-2.5H6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M16 10v17M9.5 12h3M9.5 16h3M20 16l1.8 1.8L25 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="brand-type">Study Space</span>
    </a>
    <a class="home-link" href="/">↖ 学习首页</a>
  </header>
  <main class="page-shell" id="main-content">
    <div class="contest-heading"><h1>数学竞赛</h1><div class="mode-control" role="group" aria-label="题库来源"><button id="private-mode" type="button" aria-pressed="true">本机题库</button><button id="example-mode" type="button" aria-pressed="false">原创示例</button></div></div>
    <div id="notice" class="notice" role="status" hidden></div>
    <div id="storage-notice" class="notice warning" role="alert" hidden></div>
    <div id="math-notice" class="notice warning" role="status" hidden></div>
    <div id="error" class="notice error" role="alert" hidden></div>
    <div class="workspace-bar"><nav class="workspace-tabs" aria-label="竞赛功能"><button type="button" data-view="library" aria-current="page">题库</button><button type="button" data-view="wrong">错题本</button><button type="button" data-view="bookmarks">收藏</button><button type="button" data-view="history">练习记录</button></nav><div class="practice-stats" aria-live="polite"><span><b id="count-total">0</b> 题</span><span><b id="count-answered">0</b> 已答</span><span><b id="count-accuracy">—</b> 正确率</span></div></div>
    <section id="library-view" aria-label="竞赛题库">
      <div id="contest-cards" class="contest-cards" role="group" aria-label="选择竞赛"></div>
      <section class="library-panel">
        <div class="library-heading"><h2 id="library-title">AMC 10</h2><span id="exam-count" class="muted"></span></div>
        <div class="library-filters"><label class="search-field"><span>搜索试卷</span><input id="search" type="search" placeholder="年份 / 卷别" autocomplete="off"></label><label class="year-field"><span>年份</span><select id="year"><option value="">全部年份</option></select></label><label class="supplemental-field"><input id="supplemental" type="checkbox">包含补充卷</label></div>
        <div id="exam-list" class="exam-list" aria-live="polite"></div>
      </section>
    </section>
    <section id="saved-view" class="library-panel" hidden><div class="library-heading"><h2 id="saved-title"></h2><button id="clear-history" class="quiet-button" type="button" hidden>清除本模式记录</button></div><div id="saved-list" class="saved-list"></div></section>
    <section id="practice-view" hidden aria-label="答题区">
      <div class="practice-top"><button id="back-library" class="back-button" type="button">← 试卷目录</button><h2 id="exam-title"></h2><span id="practice-progress" class="muted"></span></div>
      <div class="practice-grid">
        <aside class="question-sidebar"><div class="sidebar-heading"><h3>题号</h3><span id="question-total"></span></div><div id="question-nav" class="question-nav" aria-label="选择题号"></div><div class="nav-legend"><span><i class="dot done"></i>已答</span><span><i class="dot draft"></i>草稿</span></div><div id="missing-notice" class="notice warning" hidden></div></aside>
        <article id="question-panel" class="question-panel" aria-labelledby="question-title" aria-busy="false">
          <div class="question-heading"><div><span id="question-kind" class="type-label"></span><h3 id="question-title" tabindex="-1"></h3></div><button id="bookmark" type="button" class="bookmark-button" aria-pressed="false">☆ 收藏</button></div>
          <div id="quality-notice" class="notice warning" hidden></div>
          <div id="statement" class="math-content statement" lang="en"></div>
          <fieldset id="choices" class="choice-list"><legend class="sr-only">选择答案</legend></fieldset>
          <div id="integer-area" class="integer-area" hidden><label for="integer-answer">你的答案</label><input id="integer-answer" type="text" inputmode="numeric" maxlength="3" pattern="[0-9]{1,3}" autocomplete="off" placeholder="000–999"><span class="muted">整数 0–999</span></div>
          <div id="proof-area" hidden><label class="proof-label" for="proof-draft">证明草稿</label><textarea id="proof-draft" rows="9" maxlength="20000" placeholder="记录你的证明思路…"></textarea><div class="draft-status"><span>证明题不自动评分</span><span id="draft-status" role="status"></span></div></div>
          <div class="answer-actions"><button id="check-answer" type="button" class="primary-button">检查答案</button><button id="reveal-answer" type="button" class="quiet-button">查看参考答案</button></div>
          <div id="feedback" class="notice" role="status" hidden></div>
          <details id="solution-details" class="solution-details"><summary>参考解答 <span id="solution-count"></span></summary><div id="solution-warning" class="notice warning">参考解答未经逐题数学核验，可能有遗漏或版本差异。查看后不再计入本题正确率。</div><div id="solution-body" class="math-content" lang="en"></div></details>
          <details class="source-details" id="source-details"><summary>来源与质量</summary><div id="source-body"></div></details>
          <div class="question-bottom"><button id="previous" type="button" class="quiet-button">← 上一题</button><span id="position" class="muted"></span><button id="next" type="button" class="quiet-button">下一题 →</button></div>
        </article>
      </div>
    </section>
    <div class="local-record-note">记录仅保存在当前浏览器，不与账号或其他设备同步。</div>
  </main>
  <noscript><p>请启用 JavaScript 以选择试卷和作答。</p></noscript>
</body>
</html>
