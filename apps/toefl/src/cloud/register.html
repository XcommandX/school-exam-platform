<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>邀请注册 · TOEFL Practice</title><link rel="icon" href="__FAVICON__"><style>
:root{color-scheme:light;--ink:#242b36;--muted:#767c87;--line:#e4e6ed;--brand:#5354b9;--surface:#fff;--bg:#f7f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;min-height:100dvh;display:grid;place-items:center;padding:35px 20px}.shell{width:100%;max-width:420px}.brand{display:flex;align-items:center;gap:12px;margin:0 0 24px;font-weight:650;line-height:1.5}.brand-mark{width:40px;height:40px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.2px;font-weight:400}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:0 5px 24px #1c254a04}h1{font-size:23px;margin:0 0 10px;font-weight:650;letter-spacing:-.4px}p{font-size:13px;color:var(--muted);margin:0 0 20px}label{display:block;margin:20px 0 6px;font-size:13px}input,button{font:inherit;width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:var(--surface)}input:focus{outline:3px solid #5354b926;outline-offset:1px;border-color:var(--brand)}button{cursor:pointer;background:var(--brand);border-color:var(--brand);color:white;margin-top:26px;font-size:14px;font-weight:550}button:disabled{opacity:.5;cursor:wait}.hint{font-size:11px;color:var(--muted);margin-top:5px}#message{font-size:13px;line-height:1.8;margin:18px 0 0;color:#b3635c;min-height:0}.foot{font-size:11px;line-height:1.9;color:var(--muted);margin:18px 0;text-align:center}a{color:var(--brand);text-decoration:none}#registered{color:var(--brand)}[hidden]{display:none!important}@media(max-width:480px){.card{padding:25px 22px}body{padding:25px 16px}input{font-size:16px}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#e7e9f0;--muted:#9da4b6;--line:#363c4e;--brand:#a9a8ed;--surface:#202534;--bg:#171c27}button{color:#171c27}}
</style></head><body><main class="shell"><div class="brand">__BRAND__<div>TOEFL Practice<small>私人机经练习</small></div></div><section class="card"><h1 id="title">邀请注册</h1><p id="intro">正在确认邀请…</p><form id="register-form" hidden><label for="username">用户名</label><input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" pattern="[A-Za-z0-9_-]{2,40}" maxlength="40" minlength="2" required><div class="hint">2–40 位字母、数字、下划线或连字符</div><label for="password">密码</label><input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="200" required><div class="hint">至少 10 个字符</div><label for="confirm-password">确认密码</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="200" required><button id="submit">创建账号</button></form><p id="message" role="status" aria-live="polite"></p><p id="registered" hidden>账号已创建，正在进入练习…</p></section><p class="foot">邀请仅用一次。学习记录独立保存。<br>管理员可查看学习统计、逐题分数和词汇进度。<br><a href="/login">已有账号，前往登录</a></p></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),params=new URLSearchParams(location.hash.slice(1));let token=params.get('token')||'',busy=false;history.replaceState(null,'',location.pathname);window.addEventListener('hashchange',()=>{if(location.hash)location.reload()});async function call(path,data){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),d;try{d=await r.json()}catch{throw Error('暂时无法连接，请重新打开邀请链接。')}if(!r.ok)throw Object.assign(Error(d.error||'请求失败'),{status:r.status});return d}function unavailable(t){$('#register-form').hidden=true;$('#title').textContent='邀请暂不可用';$('#intro').textContent='请联系管理员获取新的邀请链接。';$('#message').textContent=t}
$('#register-form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;$('#message').textContent='';if($('#password').value!==$('#confirm-password').value){$('#message').textContent='两次输入的密码不一致。';$('#confirm-password').focus();return}busy=true;$('#submit').disabled=true;$('#submit').textContent='正在创建…';try{await call('/api/register',{token,username:$('#username').value.trim(),password:$('#password').value});token='';$('#password').value='';$('#confirm-password').value='';$('#register-form').hidden=true;$('#registered').hidden=false;location.replace('/')}catch(err){$('#message').textContent=err.message;if(err.status===403)unavailable(err.message)}finally{busy=false;$('#submit').disabled=false;$('#submit').textContent='创建账号'}});
(async()=>{if(!token){unavailable('请从完整邀请链接进入；刷新后需重新打开原链接。');return}try{await call('/api/invitations/check',{token});$('#intro').textContent='设置你的用户名和密码。';$('#register-form').hidden=false;$('#username').focus()}catch(e){unavailable(e.message)}})();})();
</script></body></html>
